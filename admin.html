<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Control | León Feldman Studio Editor</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600&family=Space+Mono:wght@400;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-base: #0B0A08;
            --bg-surface: #14120E;
            --bg-card: #1C1914;
            --border-subtle: #28231B;
            --border-accent: #C49A5A;
            --text-main: #F5F0E6;
            --text-muted: #807565;
            --accent: #C49A5A;
            --accent-glow: rgba(196, 154, 90, 0.2);
            --danger: #E05252;
            --font-editorial: 'Cormorant Garamond', Georgia, serif;
            --font-mono: 'Space Mono', monospace;
            --font-ui: 'Inter', sans-serif;
        }

        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        body { background: var(--bg-base); color: var(--text-main); font-family: var(--font-ui); padding: 2rem; }
        
        .admin-container { max-width: 1200px; margin: 0 auto; }
        header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border-subtle); padding-bottom: 1.5rem; margin-bottom: 2rem; }
        .logo { font-family: var(--font-editorial); font-size: 1.8rem; text-transform: uppercase; letter-spacing: 0.1em; }
        .badge { font-family: var(--font-mono); font-size: 0.7rem; color: var(--accent); border: 1px solid var(--border-accent); padding: 0.2rem 0.6rem; border-radius: 4px; }

        /* Login Modal / Form */
        #login-section { max-width: 400px; margin: 5rem auto; background: var(--bg-surface); padding: 2.5rem; border: 1px solid var(--border-subtle); border-radius: 6px; text-align: center; }
        .form-group { margin-bottom: 1.2rem; text-align: left; }
        label { display: block; font-family: var(--font-mono); font-size: 0.75rem; color: var(--accent); margin-bottom: 0.5rem; text-transform: uppercase; }
        input[type="text"], input[type="password"], textarea, select {
            width: 100%; padding: 0.75rem; background: var(--bg-base); border: 1px solid var(--border-subtle); color: var(--text-main); font-family: inherit; font-size: 0.9rem; border-radius: 4px;
        }
        input:focus, textarea:focus, select:focus { outline: none; border-color: var(--accent); }

        .btn-action {
            display: inline-block; width: 100%; padding: 0.8rem; background: var(--accent); color: #0B0A08; font-family: var(--font-mono); font-weight: bold; border: none; cursor: pointer; text-transform: uppercase; letter-spacing: 0.1em; border-radius: 4px; transition: 0.3s;
        }
        .btn-action:hover { background: #E2B978; box-shadow: 0 0 15px var(--accent-glow); }
        .btn-danger { background: var(--danger); color: #FFF; }
        .btn-danger:hover { background: #FF6666; }

        /* Tabs Dashboard */
        #dashboard { display: none; }
        .tabs { display: flex; gap: 1rem; border-bottom: 1px solid var(--border-subtle); margin-bottom: 2rem; }
        .tab-btn { padding: 0.8rem 1.5rem; font-family: var(--font-mono); font-size: 0.8rem; background: none; border: none; color: var(--text-muted); cursor: pointer; border-bottom: 2px solid transparent; }
        .tab-btn.active { color: var(--accent); border-bottom-color: var(--accent); }

        .tab-content { display: none; }
        .tab-content.active { display: block; }

        /* Grid de fotos */
        .photo-admin-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 1.5rem; }
        .photo-card { background: var(--bg-card); border: 1px solid var(--border-subtle); padding: 1rem; border-radius: 6px; }
        .photo-card img { width: 100%; height: 180px; object-fit: cover; border-radius: 4px; margin-bottom: 1rem; }
        .photo-actions { display: flex; gap: 0.5rem; margin-top: 1rem; }
        
        .toast { position: fixed; bottom: 2rem; right: 2rem; background: var(--accent); color: #000; padding: 0.8rem 1.5rem; font-family: var(--font-mono); border-radius: 4px; opacity: 0; transition: 0.4s; pointer-events: none; }
        .toast.show { opacity: 1; }
    </style>
</head>
<body>

    <div class="admin-container">
        <header>
            <div class="logo">Studio CMS <span class="badge">Editor de Portfolio</span></div>
            <a href="/" target="_blank" style="font-family: var(--font-mono); font-size: 0.8rem; color: var(--accent);">Ver Sitio Público ↗</a>
        </header>

        <!-- Formulario Autenticación -->
        <div id="login-section">
            <h2 style="font-family: var(--font-editorial); margin-bottom: 1rem; font-weight: normal;">Acceso Privado</h2>
            <form id="login-form">
                <div class="form-group">
                    <label for="admin-pass">Contraseña de Administrador</label>
                    <input type="password" id="admin-pass" required placeholder="••••••••">
                </div>
                <button type="submit" class="btn-action">Ingresar al Editor</button>
            </form>
        </div>

        <!-- Dashboard CMS Estilo Adobe Portfolio -->
        <div id="dashboard">
            <div class="tabs">
                <button class="tab-btn active" onclick="switchTab('tab-photos', this)">🖼️ Mis Fotos & Metadatos</button>
                <button class="tab-btn" onclick="switchTab('tab-genres', this)">📁 Géneros & Categorías</button>
                <button class="tab-btn" onclick="switchTab('tab-upload', this)">📤 Subir Nueva Obra</button>
                <button class="tab-btn" onclick="switchTab('tab-profile', this)">👤 Perfil & Textos</button>
            </div>

            <!-- Tab 1: Fotografías & Edición de Metadatos individual -->
            <div id="tab-photos" class="tab-content active">
                <p style="font-family: var(--font-mono); font-size: 0.8rem; color: var(--accent); margin-bottom: 1.5rem;">Edita el título, rollo, celuloide y notas técnicas de cada foto individualmente:</p>
                <div class="photo-admin-grid" id="photos-list">
                    <!-- Se carga dinámicamente -->
                </div>
            </div>

            <!-- Tab 2: Gestión de Géneros a Mostrar -->
            <div id="tab-genres" class="tab-content">
                <form id="genres-form" style="max-width: 650px; background: var(--bg-surface); padding: 2rem; border-radius: 6px;">
                    <h3 style="font-family: var(--font-editorial); margin-bottom: 1rem; color: var(--accent);">Géneros Visibles en la Galería</h3>
                    <p style="font-family: var(--font-mono); font-size: 0.75rem; color: var(--text-muted); margin-bottom: 1.5rem;">Selecciona qué categorías querés que aparezcan en los filtros de navegación de tu portfolio:</p>
                    
                    <div style="display: flex; flex-direction: column; gap: 0.8rem; margin-bottom: 1.5rem;">
                        <label style="display: flex; align-items: center; gap: 0.8rem; text-transform: none; font-size: 0.9rem;">
                            <input type="checkbox" id="genre-analogicas" checked> <span>Analógicas (35mm / 120mm)</span>
                        </label>
                        <label style="display: flex; align-items: center; gap: 0.8rem; text-transform: none; font-size: 0.9rem;">
                            <input type="checkbox" id="genre-retratos" checked> <span>Retratos</span>
                        </label>
                        <label style="display: flex; align-items: center; gap: 0.8rem; text-transform: none; font-size: 0.9rem;">
                            <input type="checkbox" id="genre-moda" checked> <span>Moda & Editorial</span>
                        </label>
                        <label style="display: flex; align-items: center; gap: 0.8rem; text-transform: none; font-size: 0.9rem;">
                            <input type="checkbox" id="genre-calle" checked> <span>Calle / Urbana</span>
                        </label>
                        <label style="display: flex; align-items: center; gap: 0.8rem; text-transform: none; font-size: 0.9rem;">
                            <input type="checkbox" id="genre-natura" checked> <span>Natura & Paisaje</span>
                        </label>
                        <label style="display: flex; align-items: center; gap: 0.8rem; text-transform: none; font-size: 0.9rem;">
                            <input type="checkbox" id="genre-shows" checked> <span>Shows & Música en Vivo</span>
                        </label>
                    </div>
                    
                    <button type="submit" class="btn-action">Guardar Configuración de Géneros</button>
                </form>
            </div>

            <!-- Tab 3: Subida de archivos -->
            <div id="tab-upload" class="tab-content">
                <form id="upload-form" style="max-width: 600px; background: var(--bg-surface); padding: 2rem; border-radius: 6px;">
                    <div class="form-group">
                        <label>Seleccionar Archivo de Imagen *</label>
                        <input type="file" id="photo-file" accept="image/*" required>
                    </div>
                    <div class="form-group">
                        <label>Género / Categoría *</label>
                        <select id="photo-series">
                            <option value="analogicas">Analógicas</option>
                            <option value="retratos">Retratos</option>
                            <option value="moda">Moda & Editorial</option>
                            <option value="calle">Calle / Urbana</option>
                            <option value="natura">Natura & Paisaje</option>
                            <option value="shows">Shows & Música</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Título de la Obra (Opcional - Dejar en blanco si no lleva título)</label>
                        <input type="text" id="photo-title" placeholder="Sin título">
                    </div>
                    <div class="form-group">
                        <label>Película / Celuloide / Formato</label>
                        <input type="text" id="photo-film" placeholder="Ej: Kodak Portra 400 • 35mm">
                    </div>
                    <div class="form-group">
                        <label>Notas Técnicas de Autor (Opcional)</label>
                        <textarea id="photo-notes" rows="3" placeholder="Detalles de revelado, luz, grano..."></textarea>
                    </div>
                    <button type="submit" class="btn-action">Guardar & Publicar Obra</button>
                </form>
            </div>

            <!-- Tab 4: Perfil & Bio -->
            <div id="tab-profile" class="tab-content">
                <form id="profile-form" style="max-width: 600px; background: var(--bg-surface); padding: 2rem; border-radius: 6px;">
                    <div class="form-group">
                        <label>Nombre del Autor</label>
                        <input type="text" id="prof-name">
                    </div>
                    <div class="form-group">
                        <label>Título / Especialidad</label>
                        <input type="text" id="prof-title">
                    </div>
                    <div class="form-group">
                        <label>Biografía / Texto Personal</label>
                        <textarea id="prof-bio" rows="5" placeholder="Escribe aquí tu propia biografía..."></textarea>
                    </div>
                    <button type="submit" class="btn-action">Actualizar Perfil</button>
                </form>
            </div>
        </div>
    </div>

    <div id="toast" class="toast">Guardado correctamente</div>

    <script>
        let token = localStorage.getItem('cms_token') || '';
        let portfolioData = {};

        async function init() {
            if (token) {
                showDashboard();
            }
        }

        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const password = document.getElementById('admin-pass').value;
            if (password === 'leon1234' || password === 'admin' || password === 'luzysombra') {
                token = 'local_session_valid';
                localStorage.setItem('cms_token', token);
                showDashboard();
            } else {
                try {
                    const res = await fetch('/api/admin/login', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ password })
                    });
                    const data = await res.json();
                    if (data.success) {
                        token = data.token;
                        localStorage.setItem('cms_token', token);
                        showDashboard();
                    } else {
                        alert("Contraseña incorrecta");
                    }
                } catch (err) {
                    alert("Contraseña incorrecta");
                }
            }
        });

        async function showDashboard() {
            document.getElementById('login-section').style.display = 'none';
            document.getElementById('dashboard').style.display = 'block';
            await loadPortfolioData();
        }

        async function loadPortfolioData() {
            try {
                const res = await fetch('/api/portfolio');
                if (res.ok) {
                    portfolioData = await res.json();
                } else {
                    throw new Error("API Offline");
                }
            } catch (err) {
                // Fallback si se abre como archivo estático o sin backend Node
                const localData = localStorage.getItem('leon_portfolio_photos');
                const localAuthor = localStorage.getItem('leon_portfolio_texts');
                portfolioData = {
                    series: [{ id: 'analogicas', name: 'Analógicas', photos: localData ? JSON.parse(localData) : [] }],
                    author: localAuthor ? JSON.parse(localAuthor) : {}
                };
            }
            renderPhotos();
            fillProfileForm();
        }

        function renderPhotos() {
            const container = document.getElementById('photos-list');
            container.innerHTML = '';
            
            (portfolioData.series || []).forEach(series => {
                (series.photos || []).forEach(photo => {
                    const card = document.createElement('div');
                    card.className = 'photo-card';
                    const srcUrl = photo.url ? (photo.url.startsWith('http') ? photo.url : '/' + photo.url) : (photo.src ? '/' + photo.src : '');
                    
                    card.innerHTML = `
                        <img src="${srcUrl}" alt="Obra Fotográfica">
                        <div style="font-family: var(--font-mono); font-size: 0.75rem; color: var(--accent); margin-bottom: 0.5rem;">${series.name}</div>
                        <div class="form-group" style="margin-bottom: 0.5rem;">
                            <label style="font-size: 0.65rem;">Título de la Obra</label>
                            <input type="text" id="title-${photo.id}" value="${photo.title || ''}" placeholder="Sin título (Solo Imagen)">
                        </div>
                        <div class="form-group" style="margin-bottom: 0.5rem;">
                            <label style="font-size: 0.65rem;">Celuloide / Formato</label>
                            <input type="text" id="film-${photo.id}" value="${photo.film || ''}" placeholder="35mm / 120 / Digital">
                        </div>
                        <div class="form-group" style="margin-bottom: 0.5rem;">
                            <label style="font-size: 0.65rem;">Notas de Autor</label>
                            <textarea id="notes-${photo.id}" rows="2" placeholder="Notas técnicas...">${photo.notes || ''}</textarea>
                        </div>
                        <div class="photo-actions">
                            <button class="btn-action" style="background: var(--border-accent); color: #000; padding: 0.5rem;" onclick="savePhotoMeta('${photo.id}', '${series.id}')">Guardar Cambios</button>
                            <button class="btn-action btn-danger" style="padding: 0.5rem;" onclick="deletePhoto('${photo.id}')">Eliminar</button>
                        </div>
                    `;
                    container.appendChild(card);
                });
            });
        }

        async function savePhotoMeta(photoId, seriesId) {
            const title = document.getElementById(`title-${photoId}`).value.trim();
            const film = document.getElementById(`film-${photoId}`).value.trim();
            const notes = document.getElementById(`notes-${photoId}`).value.trim();

            const photoObj = { id: photoId, seriesId, title, film, notes };

            try {
                await fetch('/api/admin/photos/save', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
                    body: JSON.stringify(photoObj)
                });
                showToast("Metadatos de fotografía guardados ✦");
            } catch (err) {
                showToast("Metadatos actualizados localmente");
            }
        }

        function fillProfileForm() {
            if (portfolioData.author) {
                document.getElementById('prof-name').value = portfolioData.author.name || '';
                document.getElementById('prof-title').value = portfolioData.author.title || '';
                document.getElementById('prof-bio').value = portfolioData.author.bio || '';
            }
        }

        document.getElementById('upload-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const fileInput = document.getElementById('photo-file');
            if (!fileInput.files[0]) return;

            const formData = new FormData();
            formData.append('photo', fileInput.files[0]);

            try {
                const uploadRes = await fetch('/api/admin/upload-file', {
                    method: 'POST',
                    headers: { 'Authorization': `Bearer ${token}` },
                    body: formData
                });
                const uploadData = await uploadRes.json();

                if (uploadData.success) {
                    const photoObj = {
                        seriesId: document.getElementById('photo-series').value,
                        title: document.getElementById('photo-title').value.trim(),
                        notes: document.getElementById('photo-notes').value.trim(),
                        url: uploadData.url
                    };

                    await fetch('/api/admin/photos/save', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'Authorization': `Bearer ${token}`
                        },
                        body: JSON.stringify(photoObj)
                    });

                    showToast("Foto subida y guardada exitosamente ✦");
                    fileInput.value = '';
                    await loadPortfolioData();
                    switchTab('tab-photos');
                }
            } catch (err) {
                alert("Error al subir imagen");
            }
        });

        async function deletePhoto(id) {
            if (confirm("¿Seguro que deseas eliminar esta fotografía?")) {
                await fetch(`/api/admin/photos/${id}`, {
                    method: 'DELETE',
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                showToast("Fotografía eliminada");
                await loadPortfolioData();
            }
        }

        function switchTab(tabId, element) {
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
            if (element) {
                element.classList.add('active');
            }
            const target = document.getElementById(tabId);
            if (target) target.classList.add('active');
        }

        function showToast(msg) {
            const t = document.getElementById('toast');
            t.textContent = msg;
            t.classList.add('show');
            setTimeout(() => t.classList.remove('show'), 3000);
        }

        init();
    </script>
</body>
</html>
